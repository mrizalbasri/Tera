name: tera

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    env_file:
      - ./backend/data/local/postgres.env
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # PostgreSQL 18 uses a version-specific PGDATA below this directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
